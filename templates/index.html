<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Character AI Chatroom</title>
<style>
  :root {
    --bg: #1e1f26;
    --panel: #262832;
    --border: #383a48;
    --text: #e8e8ec;
    --muted: #8b8d9b;
    --accent: #5b8dff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 17px; margin: 0; }
  #new-session-btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  #new-session-btn:hover { opacity: 0.85; }
  #roster {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    padding: 10px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .roster-item { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .avatar {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    min-width: 20px;
    border-radius: 50%;
    font-size: 11px;
    line-height: 1;
    color: white;
    flex-shrink: 0;
  }
  .msg-avatar { margin-right: 4px; vertical-align: -5px; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg { max-width: 80%; line-height: 1.4; }
  .msg .name { font-weight: 600; margin-right: 6px; }
  .msg.user { align-self: flex-end; text-align: right; color: var(--text); }
  .msg.user .bubble {
    background: var(--accent);
    color: white;
    padding: 8px 12px;
    border-radius: 12px 12px 2px 12px;
    display: inline-block;
  }
  .msg.character .bubble {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 8px 12px;
    border-radius: 12px 12px 12px 2px;
    display: inline-block;
  }
  .msg.error .bubble {
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--muted);
    font-style: italic;
  }
  #typing { padding: 0 20px 8px; color: var(--muted); font-size: 13px; font-style: italic; min-height: 18px; }
  #input-bar {
    display: flex;
    gap: 10px;
    padding: 14px 20px;
    background: var(--panel);
    border-top: 1px solid var(--border);
  }
  #message-input {
    flex: 1;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  #message-input:focus { outline: 1px solid var(--accent); }
  #send-btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 0 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  #send-btn:disabled { opacity: 0.5; cursor: default; }
  .header-actions { display: flex; gap: 10px; }
  #manage-btn {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  #manage-btn:hover { border-color: var(--accent); }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: 520px;
    max-width: 92vw;
    max-height: 86vh;
    overflow-y: auto;
    padding: 20px;
  }
  .modal h2 { margin: 0 0 14px; font-size: 16px; }
  .modal-close { float: right; background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; }
  .char-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .char-row .left { display: flex; align-items: center; gap: 8px; }
  .remove-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 5px;
    padding: 3px 8px;
    cursor: pointer;
    font-size: 12px;
  }
  .remove-btn:hover { color: #e06a6a; border-color: #e06a6a; }
  .conv-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .conv-info { flex: 1; min-width: 0; }
  .conv-name-row { display: flex; align-items: center; gap: 6px; }
  .conv-name {
    font-weight: 600;
    cursor: pointer;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .conv-name:hover { color: var(--accent); }
  .conv-name.current { color: var(--accent); }
  .conv-rename-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 12px;
    padding: 0;
    flex-shrink: 0;
  }
  .conv-rename-btn:hover { color: var(--text); }
  .conv-meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .conv-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .conv-rename-input {
    background: var(--bg);
    border: 1px solid var(--accent);
    color: var(--text);
    border-radius: 5px;
    padding: 3px 6px;
    font-size: 13px;
    font-family: inherit;
    width: 100%;
  }
  .modal form { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
  .modal label { font-size: 12px; color: var(--muted); margin-bottom: -4px; }
  .modal input, .modal textarea, .modal select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 13px;
    font-family: inherit;
    resize: vertical;
  }
  .modal .row2 { display: flex; gap: 8px; }
  .modal .row2 > * { flex: 1; }
  #add-char-btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 9px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    margin-top: 4px;
  }
  #char-form-error { color: #e06a6a; font-size: 12px; min-height: 16px; }
  .pick-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin: 12px 0;
    max-height: 40vh;
    overflow-y: auto;
  }
  .pick-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
  }
  #pick-search, #char-search, #new-session-name {
    display: block;
    width: 100%;
    margin: 10px 0;
  }
  label[for="new-session-name"] {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-top: 8px;
    margin-bottom: -6px;
  }
  .pick-actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .link-btn {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 12px;
    cursor: pointer;
    padding: 0;
  }
  .group-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 14px 0 4px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }
  .group-header:first-child { margin-top: 0; }
  .group-header .group-title {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted);
  }
  .group-header .group-actions { display: flex; gap: 8px; }
  #start-session-btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 9px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    width: 100%;
  }
</style>
</head>
<body>
  <header>
    <h1>Character AI Chatroom</h1>
    <div class="header-actions">
      <button id="manage-btn">Manage Characters</button>
      <button id="conversations-btn">Conversations</button>
      <button id="new-session-btn">New Conversation</button>
    </div>
  </header>
  <div id="roster"></div>
  <div id="messages"></div>
  <div id="typing"></div>
  <div id="input-bar">
    <input id="message-input" type="text" placeholder="Type a message..." autocomplete="off">
    <button id="send-btn">Send</button>
  </div>

  <div class="modal-overlay" id="new-session-overlay">
    <div class="modal">
      <button class="modal-close" id="new-session-close-btn">&times;</button>
      <h2>Start a new conversation</h2>
      <p style="color:var(--muted); font-size:13px; margin-top:-8px;">
        Choose who's in this conversation.
      </p>
      <label for="new-session-name">Name (optional)</label>
      <input type="text" id="new-session-name" placeholder="Chat Session">
      <input type="text" id="pick-search" placeholder="Search characters or shows...">
      <div class="pick-actions">
        <button type="button" class="link-btn" id="pick-all-btn">Select all</button>
        <button type="button" class="link-btn" id="pick-none-btn">Select none</button>
      </div>
      <div class="pick-list" id="pick-list"></div>
      <p id="pick-empty" style="display:none; color:var(--muted); font-size:13px;">No characters match "<span id="pick-empty-query"></span>".</p>
      <button id="start-session-btn">Start Conversation</button>
    </div>
  </div>

  <div class="modal-overlay" id="manage-overlay">
    <div class="modal">
      <button class="modal-close" id="modal-close-btn">&times;</button>
      <h2>Characters</h2>
      <input type="text" id="char-search" placeholder="Search characters or shows...">
      <div id="char-list"></div>
      <p id="char-empty" style="display:none; color:var(--muted); font-size:13px;">No characters match "<span id="char-empty-query"></span>".</p>

      <form id="char-form">
        <label>Name</label>
        <input id="f-name" type="text" required>

        <label>Show/universe (groups them in the picker - pick an existing one or type your own)</label>
        <input id="f-show" type="text" list="show-options" placeholder="Game of Thrones, Vikings, The Walking Dead, or your own">
        <datalist id="show-options"></datalist>

        <label>Avatar (a single emoji, optional - defaults to their first initial)</label>
        <input id="f-avatar" type="text" placeholder="🍷" maxlength="8">

        <label>Personality (cover multiple sides of them, not just one famous trait)</label>
        <textarea id="f-personality" rows="3" placeholder="Their core traits AND their humor, warmth, insecurities, quiet moments..." required></textarea>

        <label>Speech style (mention that they keep replies short!)</label>
        <textarea id="f-speech-style" rows="2" required></textarea>

        <label>World/setting (matters! e.g. "modern Earth, phones are normal" or "medieval fantasy, no technology")</label>
        <textarea id="f-world-context" rows="2" required></textarea>

        <label>Backstory (optional)</label>
        <textarea id="f-backstory" rows="2"></textarea>

        <label>Sample lines (5-6 short lines spanning different moods, not all one tone)</label>
        <textarea id="f-sample-lines" rows="4" placeholder="Didn't ask.&#10;Careful. I don't forget things like that.&#10;That's actually kind of funny.&#10;I'm tired. Not of you. Of all of it."></textarea>

        <label>Relationships (one per line: Name: how they feel about them)</label>
        <textarea id="f-relationships" rows="2" placeholder="Jon Snow: trusts him completely"></textarea>

        <label>Triggers/interests (comma-separated)</label>
        <input id="f-triggers" type="text" placeholder="wine, politics, family">

        <div class="row2">
          <div>
            <label>Interrupt tendency</label>
            <select id="f-interrupt">
              <option value="low">low</option>
              <option value="medium" selected>medium</option>
              <option value="high">high</option>
            </select>
          </div>
          <div>
            <label>Assertiveness</label>
            <select id="f-assertiveness">
              <option value="low">low</option>
              <option value="medium" selected>medium</option>
              <option value="high">high</option>
            </select>
          </div>
        </div>

        <div id="char-form-error"></div>
        <button type="submit" id="add-char-btn">Add Character</button>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="conversations-overlay">
    <div class="modal">
      <button class="modal-close" id="conversations-close-btn">&times;</button>
      <h2>Conversations</h2>
      <div id="conversations-list"></div>
    </div>
  </div>

<script>
const COLOR_PALETTE = [
  "#5b8dff", "#e0b04a", "#57c26b", "#d97fd9",
  "#6ac3d9", "#e06a6a", "#8ee0d0", "#e0e05b",
  "#a0e05b", "#e08ee0", "#8ea0e0", "#e08e8e",
];

let colorMap = {};
let characters = [];
let sessionId = null;
let eventSource = null;
let typingName = null;

const messagesEl = document.getElementById("messages");
const rosterEl = document.getElementById("roster");
const typingEl = document.getElementById("typing");
const inputEl = document.getElementById("message-input");
const sendBtn = document.getElementById("send-btn");
const newSessionBtn = document.getElementById("new-session-btn");
const manageBtn = document.getElementById("manage-btn");
const manageOverlay = document.getElementById("manage-overlay");
const modalCloseBtn = document.getElementById("modal-close-btn");
const charListEl = document.getElementById("char-list");
const charForm = document.getElementById("char-form");
const charFormError = document.getElementById("char-form-error");
const newSessionOverlay = document.getElementById("new-session-overlay");
const newSessionCloseBtn = document.getElementById("new-session-close-btn");
const pickListEl = document.getElementById("pick-list");
const pickAllBtn = document.getElementById("pick-all-btn");
const pickNoneBtn = document.getElementById("pick-none-btn");
const startSessionBtn = document.getElementById("start-session-btn");
const pickSearchEl = document.getElementById("pick-search");
const pickEmptyEl = document.getElementById("pick-empty");
const pickEmptyQueryEl = document.getElementById("pick-empty-query");
const charSearchEl = document.getElementById("char-search");
const charEmptyEl = document.getElementById("char-empty");
const charEmptyQueryEl = document.getElementById("char-empty-query");
const newSessionNameEl = document.getElementById("new-session-name");
const conversationsBtn = document.getElementById("conversations-btn");
const conversationsOverlay = document.getElementById("conversations-overlay");
const conversationsCloseBtn = document.getElementById("conversations-close-btn");
const conversationsListEl = document.getElementById("conversations-list");

const SHOW_ORDER = ["Game of Thrones", "Vikings", "The Walking Dead"];

function colorFor(name) {
  return colorMap[name] || "#ffffff";
}

function avatarFor(name) {
  const character = characters.find(c => c.name === name);
  if (character && character.avatar) return character.avatar;
  return name ? name.trim().charAt(0).toUpperCase() : "?";
}

function avatarHtml(name) {
  return `<span class="avatar" style="background:${colorFor(name)}">${avatarFor(name)}</span>`;
}

function groupByShow(chars) {
  const groups = {};
  chars.forEach(c => {
    const show = c.show || "Custom";
    if (!groups[show]) groups[show] = [];
    groups[show].push(c);
  });
  const shows = Object.keys(groups).sort((a, b) => {
    const ia = SHOW_ORDER.indexOf(a);
    const ib = SHOW_ORDER.indexOf(b);
    if (ia !== -1 || ib !== -1) return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
    return a.localeCompare(b);
  });
  return shows.map(show => ({ show, chars: groups[show] }));
}

function isScrolledNearBottom() {
  return messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 100;
}

function appendMessage(sender, content, kind) {
  // Checked before the new message is added, since appending changes
  // scrollHeight - otherwise this would always read as "near the bottom."
  // Your own messages always snap you back down; other arrivals only do
  // if you were already there, so scrolling up to reread something isn't
  // constantly interrupted by new replies streaming in.
  const shouldStickToBottom = kind === "user" || isScrolledNearBottom();

  const row = document.createElement("div");
  row.className = "msg " + kind;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  if (kind === "character") {
    const avatarSpan = document.createElement("span");
    avatarSpan.className = "avatar msg-avatar";
    avatarSpan.style.background = colorFor(sender);
    avatarSpan.textContent = avatarFor(sender);
    bubble.appendChild(avatarSpan);

    const nameSpan = document.createElement("span");
    nameSpan.className = "name";
    nameSpan.textContent = sender;
    nameSpan.style.color = colorFor(sender);
    bubble.appendChild(nameSpan);
  }
  bubble.appendChild(document.createTextNode(content));
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  if (shouldStickToBottom) {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
  return row;
}

async function loadCharacters() {
  const res = await fetch("/api/characters");
  characters = await res.json();
  colorMap = {};
  characters.forEach((c, i) => {
    colorMap[c.name] = COLOR_PALETTE[i % COLOR_PALETTE.length];
  });
  renderCharList();
  renderShowOptions();
}

function renderShowOptions() {
  const shows = [...new Set(characters.map(c => c.show || "Custom"))];
  const datalist = document.getElementById("show-options");
  datalist.innerHTML = shows.map(s => `<option value="${s}"></option>`).join("");
}

function renderRosterBar(names) {
  rosterEl.innerHTML = "";
  names.forEach(name => {
    const item = document.createElement("div");
    item.className = "roster-item";
    item.innerHTML = `${avatarHtml(name)}${name}`;
    rosterEl.appendChild(item);
  });
}

function renderCharList() {
  charListEl.innerHTML = "";
  if (characters.length === 0) {
    charListEl.innerHTML = '<p style="color:var(--muted); font-size:13px;">No characters yet.</p>';
    return;
  }
  groupByShow(characters).forEach(({ show, chars }) => {
    const group = document.createElement("div");
    group.className = "char-group";
    group.dataset.show = show;

    const header = document.createElement("div");
    header.className = "group-header";
    header.innerHTML = `<span class="group-title">${show} (${chars.length})</span>`;
    group.appendChild(header);

    chars.forEach(c => {
      const row = document.createElement("div");
      row.className = "char-row";
      row.dataset.name = c.name.toLowerCase();
      row.innerHTML = `
        <div class="left">
          ${avatarHtml(c.name)}
          <span>${c.name}</span>
        </div>
        <button class="remove-btn" data-name="${c.name}">Remove</button>
      `;
      group.appendChild(row);
    });
    charListEl.appendChild(group);
  });
  charListEl.querySelectorAll(".remove-btn").forEach(btn => {
    btn.addEventListener("click", () => removeCharacter(btn.dataset.name));
  });
}

function filterGroups(container, query, emptyEl, emptyQueryEl, rowSelector) {
  const q = query.trim().toLowerCase();
  let anyVisible = false;
  container.querySelectorAll(".char-group, .pick-group").forEach(group => {
    const showMatches = group.dataset.show.toLowerCase().includes(q);
    let groupHasVisible = false;
    group.querySelectorAll(rowSelector).forEach(row => {
      const matches = !q || showMatches || row.dataset.name.includes(q);
      row.style.display = matches ? "" : "none";
      if (matches) groupHasVisible = true;
    });
    group.style.display = groupHasVisible ? "" : "none";
    if (groupHasVisible) anyVisible = true;
  });
  emptyEl.style.display = anyVisible ? "none" : "block";
  emptyQueryEl.textContent = query;
}

async function removeCharacter(name) {
  if (!confirm(`Remove ${name}? This can't be undone (past messages from them stay in history).`)) {
    return;
  }
  const res = await fetch(`/api/characters/${encodeURIComponent(name)}`, { method: "DELETE" });
  if (res.ok) {
    await loadCharacters();
  } else {
    const data = await res.json();
    alert(data.error || "Could not remove character.");
  }
}

function parseLines(text) {
  return text.split("\n").map(l => l.trim()).filter(Boolean);
}

function parseRelationships(text) {
  const relationships = {};
  parseLines(text).forEach(line => {
    const idx = line.indexOf(":");
    if (idx === -1) return;
    relationships[line.slice(0, idx).trim()] = line.slice(idx + 1).trim();
  });
  return relationships;
}

async function submitNewCharacter(e) {
  e.preventDefault();
  charFormError.textContent = "";

  const payload = {
    name: document.getElementById("f-name").value.trim(),
    show: document.getElementById("f-show").value.trim(),
    avatar: document.getElementById("f-avatar").value.trim(),
    personality: document.getElementById("f-personality").value.trim(),
    speech_style: document.getElementById("f-speech-style").value.trim(),
    world_context: document.getElementById("f-world-context").value.trim(),
    backstory: document.getElementById("f-backstory").value.trim(),
    sample_lines: parseLines(document.getElementById("f-sample-lines").value),
    relationships: parseRelationships(document.getElementById("f-relationships").value),
    triggers: document.getElementById("f-triggers").value.split(",").map(t => t.trim()).filter(Boolean),
    interrupt_tendency: document.getElementById("f-interrupt").value,
    assertiveness: document.getElementById("f-assertiveness").value,
  };

  const res = await fetch("/api/characters", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  const data = await res.json();

  if (!res.ok) {
    charFormError.textContent = data.error || "Could not add character.";
    return;
  }

  charForm.reset();
  await loadCharacters();
}

function openManageModal() {
  charFormError.textContent = "";
  charSearchEl.value = "";
  renderCharList();
  manageOverlay.classList.add("open");
  charSearchEl.focus();
}

function closeManageModal() {
  manageOverlay.classList.remove("open");
}

async function loadSession() {
  const res = await fetch("/api/session");
  const data = await res.json();
  sessionId = data.session_id;
  renderRosterBar(data.characters);
  messagesEl.innerHTML = "";
  data.messages.forEach(m => {
    appendMessage(m.sender, m.content, m.sender === "user" ? "user" : "character");
  });
  connectStream(sessionId);
}

function updateTypingIndicator() {
  typingEl.textContent = typingName ? `${typingName} is typing...` : "";
}

function connectStream(sid) {
  if (eventSource) eventSource.close();
  typingName = null;
  updateTypingIndicator();

  eventSource = new EventSource(`/api/stream/${sid}`);
  eventSource.onmessage = e => {
    const event = JSON.parse(e.data);
    if (event.type === "speaker_picked") {
      // The router picked them, but their line isn't written yet - this
      // fires before the (slower) "reply" event for the same character.
      // Nothing is shown before this point - there's no one to name yet.
      typingName = event.sender;
      updateTypingIndicator();
    } else if (event.type === "reply") {
      appendMessage(event.sender, event.content, "character");
      if (typingName === event.sender) typingName = null;
      updateTypingIndicator();
    } else if (event.type === "error") {
      appendMessage(null, event.message, "error");
      typingName = null;
      updateTypingIndicator();
    } else if (event.type === "round_done") {
      typingName = null;
      updateTypingIndicator();
    }
  };
}

function renderPickList() {
  pickListEl.innerHTML = "";
  groupByShow(characters).forEach(({ show, chars }) => {
    const group = document.createElement("div");
    group.className = "pick-group";
    group.dataset.show = show;

    const header = document.createElement("div");
    header.className = "group-header";
    const safeShow = show.replace(/"/g, "&quot;");
    header.innerHTML = `
      <span class="group-title">${show} (${chars.length})</span>
      <span class="group-actions">
        <button type="button" class="link-btn group-all-btn" data-show="${safeShow}">all</button>
        <button type="button" class="link-btn group-none-btn" data-show="${safeShow}">none</button>
      </span>
    `;
    group.appendChild(header);

    chars.forEach(c => {
      const row = document.createElement("label");
      row.className = "pick-row";
      row.dataset.show = show;
      row.dataset.name = c.name.toLowerCase();
      row.innerHTML = `
        <input type="checkbox" class="pick-checkbox" value="${c.name}" checked>
        ${avatarHtml(c.name)}
        <span>${c.name}</span>
      `;
      group.appendChild(row);
    });
    pickListEl.appendChild(group);
  });

  pickListEl.querySelectorAll(".group-all-btn").forEach(btn => {
    btn.addEventListener("click", () => setGroupChecked(btn.dataset.show, true));
  });
  pickListEl.querySelectorAll(".group-none-btn").forEach(btn => {
    btn.addEventListener("click", () => setGroupChecked(btn.dataset.show, false));
  });
}

function setGroupChecked(show, checked) {
  pickListEl.querySelectorAll(`.pick-row[data-show="${CSS.escape(show)}"] .pick-checkbox`)
    .forEach(cb => cb.checked = checked);
}

function openNewSessionModal() {
  newSessionNameEl.value = "";
  pickSearchEl.value = "";
  renderPickList();
  newSessionOverlay.classList.add("open");
  newSessionNameEl.focus();
}

function closeNewSessionModal() {
  newSessionOverlay.classList.remove("open");
}

async function startNewSession() {
  const selected = Array.from(pickListEl.querySelectorAll(".pick-checkbox:checked"))
    .map(cb => cb.value);
  const name = newSessionNameEl.value.trim();

  try {
    const res = await fetch("/api/session/new", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ characters: selected, name }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      alert(data.error || "Could not start that conversation.");
      return;
    }
    const data = await res.json();

    sessionId = data.session_id;
    renderRosterBar(selected.length ? selected : characters.map(c => c.name));
    messagesEl.innerHTML = "";
    connectStream(sessionId);
    closeNewSessionModal();
    inputEl.focus();
  } catch (e) {
    alert("Could not reach the server.");
  }
}

async function openConversationsModal() {
  await loadConversationsList();
  conversationsOverlay.classList.add("open");
}

function closeConversationsModal() {
  conversationsOverlay.classList.remove("open");
}

async function loadConversationsList() {
  const res = await fetch("/api/sessions");
  const sessions = await res.json();
  renderConversationsList(sessions);
}

function formatConversationMeta(session) {
  const count = session.message_count;
  const messageLabel = count === 1 ? "1 message" : `${count} messages`;
  let dateLabel = "";
  if (session.created_at) {
    const parsed = new Date(session.created_at);
    if (!isNaN(parsed)) dateLabel = " · " + parsed.toLocaleString();
  }
  return messageLabel + dateLabel;
}

function renderConversationsList(sessions) {
  conversationsListEl.innerHTML = "";
  if (sessions.length === 0) {
    conversationsListEl.innerHTML =
      '<p style="color:var(--muted); font-size:13px;">No conversations yet.</p>';
    return;
  }

  sessions.forEach(session => {
    const row = document.createElement("div");
    row.className = "conv-row";

    const info = document.createElement("div");
    info.className = "conv-info";

    const nameRow = document.createElement("div");
    nameRow.className = "conv-name-row";

    const nameSpan = document.createElement("span");
    nameSpan.className = "conv-name" + (session.id === sessionId ? " current" : "");
    nameSpan.textContent = session.name;
    nameSpan.title = "Open this conversation";
    nameSpan.addEventListener("click", () => openConversation(session.id));

    const renameBtn = document.createElement("button");
    renameBtn.className = "conv-rename-btn";
    renameBtn.title = "Rename this conversation";
    renameBtn.textContent = "✎";
    renameBtn.addEventListener("click", () => startRenamingConversation(row, nameSpan, session));

    nameRow.appendChild(nameSpan);
    nameRow.appendChild(renameBtn);

    const meta = document.createElement("div");
    meta.className = "conv-meta";
    meta.textContent = formatConversationMeta(session);

    info.appendChild(nameRow);
    info.appendChild(meta);

    const actions = document.createElement("div");
    actions.className = "conv-actions";
    const deleteBtn = document.createElement("button");
    deleteBtn.className = "remove-btn";
    deleteBtn.textContent = "Delete";
    deleteBtn.addEventListener("click", () => deleteConversation(session.id));
    actions.appendChild(deleteBtn);

    row.appendChild(info);
    row.appendChild(actions);
    conversationsListEl.appendChild(row);
  });
}

function startRenamingConversation(row, nameSpan, session) {
  if (row.querySelector(".conv-rename-input")) return; // already renaming

  const input = document.createElement("input");
  input.type = "text";
  input.className = "conv-rename-input";
  input.value = session.name;

  nameSpan.style.display = "none";
  nameSpan.insertAdjacentElement("afterend", input);
  input.focus();
  input.select();

  function stopRenaming(save) {
    input.remove();
    nameSpan.style.display = "";
    if (!save) return;
    const newName = input.value.trim();
    if (newName && newName !== session.name) {
      renameConversation(session.id, newName, nameSpan, session);
    }
  }

  input.addEventListener("keydown", e => {
    if (e.key === "Enter") stopRenaming(true);
    if (e.key === "Escape") stopRenaming(false);
  });
  input.addEventListener("blur", () => stopRenaming(true));
}

async function renameConversation(id, newName, nameSpan, session) {
  const res = await fetch(`/api/sessions/${id}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name: newName }),
  });
  if (res.ok) {
    session.name = newName;
    nameSpan.textContent = newName;
  } else {
    const data = await res.json().catch(() => ({}));
    alert(data.error || "Could not rename that conversation.");
  }
}

async function openConversation(id) {
  if (id === sessionId) {
    closeConversationsModal();
    return;
  }
  try {
    const res = await fetch(`/api/session/${id}`);
    if (!res.ok) {
      alert("Could not open that conversation.");
      return;
    }
    const data = await res.json();

    sessionId = data.session_id;
    renderRosterBar(data.characters);
    messagesEl.innerHTML = "";
    data.messages.forEach(m => {
      appendMessage(m.sender, m.content, m.sender === "user" ? "user" : "character");
    });
    connectStream(sessionId);
    closeConversationsModal();
    inputEl.focus();
  } catch (e) {
    alert("Could not reach the server.");
  }
}

async function deleteConversation(id) {
  if (!confirm("Delete this conversation? This can't be undone.")) return;

  const res = await fetch(`/api/sessions/${id}`, { method: "DELETE" });
  if (res.ok) {
    if (id === sessionId) {
      await loadSession(); // falls back to the latest remaining conversation, or a fresh one
    }
    await loadConversationsList();
  } else {
    const data = await res.json().catch(() => ({}));
    alert(data.error || "Could not delete that conversation.");
  }
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;

  // Shown right away and sent without waiting for anyone's reply, so you
  // can keep sending messages while characters are still answering earlier
  // ones - each is queued and processed in order, replies stream in one by
  // one over /api/stream as they're generated.
  appendMessage(null, text, "user");
  inputEl.value = "";
  updateSendButtonState();

  try {
    const res = await fetch("/api/message", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      appendMessage(null, data.error || "Could not send that message.", "error");
    }
  } catch (e) {
    appendMessage(null, "Could not reach the server.", "error");
  }
}

function updateSendButtonState() {
  sendBtn.disabled = inputEl.value.trim().length === 0;
}

sendBtn.addEventListener("click", sendMessage);
inputEl.addEventListener("keydown", e => {
  if (e.key === "Enter") sendMessage();
});
inputEl.addEventListener("input", updateSendButtonState);
updateSendButtonState();
newSessionBtn.addEventListener("click", openNewSessionModal);
newSessionCloseBtn.addEventListener("click", closeNewSessionModal);
newSessionOverlay.addEventListener("click", e => {
  if (e.target === newSessionOverlay) closeNewSessionModal();
});
conversationsBtn.addEventListener("click", openConversationsModal);
conversationsCloseBtn.addEventListener("click", closeConversationsModal);
conversationsOverlay.addEventListener("click", e => {
  if (e.target === conversationsOverlay) closeConversationsModal();
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (newSessionOverlay.classList.contains("open")) closeNewSessionModal();
  if (manageOverlay.classList.contains("open")) closeManageModal();
  if (conversationsOverlay.classList.contains("open")) closeConversationsModal();
});
newSessionNameEl.addEventListener("keydown", e => {
  if (e.key === "Enter") startNewSession();
});
pickAllBtn.addEventListener("click", () => {
  pickListEl.querySelectorAll(".pick-checkbox").forEach(cb => cb.checked = true);
});
pickNoneBtn.addEventListener("click", () => {
  pickListEl.querySelectorAll(".pick-checkbox").forEach(cb => cb.checked = false);
});
startSessionBtn.addEventListener("click", startNewSession);
manageBtn.addEventListener("click", openManageModal);
modalCloseBtn.addEventListener("click", closeManageModal);
manageOverlay.addEventListener("click", e => {
  if (e.target === manageOverlay) closeManageModal();
});
charForm.addEventListener("submit", submitNewCharacter);
pickSearchEl.addEventListener("input", () => {
  filterGroups(pickListEl, pickSearchEl.value, pickEmptyEl, pickEmptyQueryEl, ".pick-row");
});
charSearchEl.addEventListener("input", () => {
  filterGroups(charListEl, charSearchEl.value, charEmptyEl, charEmptyQueryEl, ".char-row");
});

(async function init() {
  try {
    await loadCharacters();
    await loadSession();
    inputEl.focus();
  } catch (e) {
    messagesEl.innerHTML =
      '<p style="color:var(--muted); padding:20px; text-align:center;">' +
      "Could not load the chatroom. Is the server running? Try refreshing the page." +
      "</p>";
  }
})();
</script>
</body>
</html>
